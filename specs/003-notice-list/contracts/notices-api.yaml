openapi: 3.0.0
info:
  title: 공지사항 API
  description: 공지사항 목록 및 상세 조회 API
  version: 1.0.0

servers:
  - url: /api
    description: API Base URL

paths:
  /notices:
    get:
      summary: 공지사항 목록 조회
      description: 공지사항 목록을 페이지네이션하여 조회합니다. 검색 기능을 지원합니다.
      operationId: getNotices
      tags:
        - Notices
      parameters:
        - name: search
          in: query
          description: 검색 키워드 (제목/본문)
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: 한 페이지에 표시할 아이템 수
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
        - name: offset
          in: query
          description: 건너뛸 아이템 수 (페이지 번호 * limit)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeListResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notices/{id}:
    get:
      summary: 공지사항 상세 조회
      description: 공지사항 ID를 통해 상세 정보를 조회합니다.
      operationId: getNoticeDetail
      tags:
        - Notices
      parameters:
        - name: id
          in: path
          description: 공지사항 ID (UUID)
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDetailResponse'
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 공지사항을 찾을 수 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    NoticeItem:
      type: object
      required:
        - id
        - title
        - isPinned
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 공지사항 고유 식별자
        title:
          type: string
          description: 공지사항 제목
        imageUrl:
          type: string
          nullable: true
          description: 이미지 URL (선택사항)
        isPinned:
          type: boolean
          description: 고정 공지사항 여부
        createdAt:
          type: string
          format: date-time
          description: 생성일시 (ISO 8601)

    NoticeDetail:
      type: object
      required:
        - id
        - title
        - content
        - isPinned
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          description: 공지사항 고유 식별자
        title:
          type: string
          description: 공지사항 제목
        content:
          type: string
          description: 공지사항 본문
        imageUrl:
          type: string
          nullable: true
          description: 이미지 URL (선택사항)
        isPinned:
          type: boolean
          description: 고정 공지사항 여부
        createdAt:
          type: string
          format: date-time
          description: 생성일시 (ISO 8601)
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: 수정일시 (ISO 8601, 선택사항)

    NoticeListData:
      type: object
      required:
        - items
        - total
        - limit
        - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NoticeItem'
          description: 공지사항 배열
        total:
          type: integer
          minimum: 0
          description: 전체 공지사항 개수
        limit:
          type: integer
          minimum: 1
          description: 페이지 크기
        offset:
          type: integer
          minimum: 0
          description: 오프셋

    NoticeListResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: 성공 여부
        data:
          $ref: '#/components/schemas/NoticeListData'

    NoticeDetailResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          description: 성공 여부
        data:
          $ref: '#/components/schemas/NoticeDetail'

    ErrorResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          description: 에러 메시지
